<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线阅读 · 《軟體世界》杂志文献资料库</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="covers/sw-001.jpg">
<style>
#rd-img.fit-w { max-width: 100%; height: auto; }
#rd-img.fit-full, .zoom-full #rd-img.fit-w, .zoom-full #spread-box img { max-width: none; }
#rd-img { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.45); cursor: pointer; }
#spread-box { display: flex; gap: 8px; align-items: flex-start; justify-content: center; }
#spread-box img { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.45); cursor: pointer; max-width: calc(50% - 4px); height: auto; }
#spread-box img:only-child { max-width: 100%; }
</style>
</head>
<body>

<div class="rd-head">
  <span class="rt" id="rtitle">在线阅读</span>
  <button id="prev" title="上一页（←）">‹ 上一页</button>
  <span><input class="pg" id="pg" value="1"> <span id="pgtotal"></span></span>
  <button id="next" title="下一页（→）">下一页 ›</button>
  <button id="mode" title="单页/双页对开切换">双页</button>
  <button id="fs" title="全屏阅读">全屏</button>
  <button id="share" title="复制当前页分享链接">分享</button>
  <button id="zoom">适应宽度</button>
  <a class="btnx" id="dl" href="#" target="_blank" rel="noopener">下载原版</a>
  <a class="btnx" id="ia" href="#" target="_blank" rel="noopener">archive.org</a>
  <a class="btnx" id="back" href="#">返回目录</a>
</div>

<div class="rd-stage" id="rd-stage" style="min-height: calc(100vh - 52px)">
  <div class="rd-status" id="rd-status">
    <div class="msg">正在加载……</div>
  </div>
  <div class="flip-wrap" id="flip-wrap">
    <img id="rd-img" class="fit-w" style="display:none" alt="杂志页面">
    <div id="spread-box" style="display:none">
      <img id="rd-img-l" alt="左页">
      <img id="rd-img-r" alt="右页">
    </div>
  </div>
</div>

<script src="assets/progress.js"></script>
<script src="assets/zoom.js"></script>
<script src="assets/page-flip.js"></script>
<script src="assets/ia-reader.js"></script>
<script src="assets/sw-register.js"></script>
</body>
</html>
