<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线阅读 · 《軟體世界》杂志文献资料库</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="covers/sw-001.jpg">
</head>
<body>

<div class="rd-head">
  <span class="rt" id="rtitle">在线阅读</span>
  <button id="prev" title="上一页（←）">‹ 上一页</button>
  <span><input class="pg" id="pg" value="1"> <span id="pgtotal"></span></span>
  <button id="next" title="下一页（→）">下一页 ›</button>
  <select id="zoom" title="缩放">
    <option value="width" selected>适应宽度</option>
    <option value="page">适应页面</option>
    <option value="1">100%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select>
  <button id="thumbs" title="页面缩略图">缩略图</button>
  <button id="mode" title="单页/双页对开切换">双页</button>
  <button id="fs" title="全屏阅读">全屏</button>
  <button id="share" title="复制当前页分享链接">分享</button>
  <a class="btnx" id="dl" href="#" target="_blank" rel="noopener">下载原版</a>
  <a class="btnx" href="index.html#catalog">返回目录</a>
</div>

<div class="rd-body">
  <div class="rd-thumbs" id="rd-thumbs"></div>
  <div class="rd-stage" id="rd-stage">
    <div class="rd-status" id="rd-status">
      <div class="msg">正在加载……</div>
      <div class="rd-progress"><i></i></div>
    </div>
    <div class="flip-wrap" id="flip-wrap">
      <canvas id="rd-canvas" style="display:none"></canvas>
      <div id="spread-box" style="display:none">
        <canvas id="rd-canvas-l"></canvas>
        <canvas id="rd-canvas-r"></canvas>
      </div>
      <img id="rd-img" style="display:none; background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.45); cursor:pointer;" alt="杂志页面">
      <div id="spread-img-box" style="display:none">
        <img id="rd-img-l" style="background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.45); cursor:pointer;" alt="左页">
        <img id="rd-img-r" style="background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.45); cursor:pointer;" alt="右页">
      </div>
    </div>
  </div>
</div>

<script src="assets/progress.js"></script>
<script src="assets/zoom.js"></script>
<script src="assets/page-flip.js"></script>
<script src="assets/reader.js"></script>
<script src="assets/sw-register.js"></script>
</body>
</html>
